[project]
name = "gh-worker"
version = "0.1.0"
description = "Automated GitHub issue handling with LLM agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Tom Rochette", email = "roctom@gmail.com" }
]
dependencies = [
    "cyclopts>=3.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
    "textual>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mkdocs>=1.5.0",
    "mkdocs-material[imaging]>=9.4.0",
]

[project.scripts]
gh-worker = "gh_worker.cli:cli"
ghw = "gh_worker.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
